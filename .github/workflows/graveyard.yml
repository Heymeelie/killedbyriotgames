name: Graveyard
on:
  pull_request:
    branches: [ main ]
    paths:
      - 'graveyard.json'
      - 'graveyard.test.ts'
      - 'package.json'
jobs: 
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Run Tests
        run: npm test
